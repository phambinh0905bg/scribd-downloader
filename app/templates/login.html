<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Media & Doc Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              850: '#131c2e',
              900: '#0f172a',
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-x-hidden selection:bg-blue-600 selection:text-white">
  <!-- Glowing Background Orbs -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse"></div>
  <div class="fixed bottom-1/4 right-1/4 w-80 h-80 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 shadow-xl shadow-blue-500/25 mb-4 ring-1 ring-white/20">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Media & Doc Hub</h1>
      <p class="text-sm text-slate-400 mt-1">Đăng nhập để truy cập hệ thống tải & quản lý tài liệu</p>
    </div>

    <!-- Login Card -->
    <div class="glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-800/80 backdrop-blur-xl relative">
      <!-- Error Message Box -->
      <div id="login-error-box" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-medium flex items-center gap-2.5">
        <svg class="w-4 h-4 flex-shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span id="login-error-text">Tên đăng nhập hoặc mật khẩu không chính xác.</span>
      </div>

      <form id="login-form" class="space-y-4">
        <!-- Username Field -->
        <div class="space-y-1.5">
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
            Tên Đăng Nhập
          </label>
          <div class="relative flex items-center">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <input 
              type="text" 
              id="username" 
              name="username" 
              required
              autocomplete="username"
              placeholder="admin" 
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
            Mật Khẩu
          </label>
          <div class="relative flex items-center">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              autocomplete="current-password"
              placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium"
            >
            <button 
              type="button" 
              id="btn-toggle-password" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 cursor-pointer"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Toggle -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="remember-me" checked class="w-4 h-4 text-blue-600 rounded bg-slate-900 border-slate-700 focus:ring-blue-500 cursor-pointer">
            <span class="text-xs text-slate-300 font-medium">Ghi nhớ đăng nhập (7 ngày)</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="btn-login-submit" 
          class="w-full mt-2 py-3 px-4 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] transition-all shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>Đăng Nhập Vào Hệ Thống</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
        <div class="inline-flex items-center gap-1.5 text-[11px] text-slate-500">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
          <span>Bảo mật phiên đăng nhập bằng mã hóa HMAC-SHA256</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember-me");
    const btnSubmit = document.getElementById("btn-login-submit");
    const errorBox = document.getElementById("login-error-box");
    const errorText = document.getElementById("login-error-text");
    const btnTogglePw = document.getElementById("btn-toggle-password");

    // Toggle password visibility
    if (btnTogglePw) {
      btnTogglePw.addEventListener("click", () => {
        const isPass = passwordInput.type === "password";
        passwordInput.type = isPass ? "text" : "password";
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const remember = rememberInput.checked;

      errorBox.classList.add("hidden");
      btnSubmit.innerText = "Đang xác thực...";
      btnSubmit.disabled = true;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, remember })
        });

        const data = await res.json();
        if (res.ok && data.status === "success") {
          btnSubmit.innerText = "Đăng nhập thành công! Đang chuyển hướng...";
          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get("next") || "/";
          window.location.href = nextUrl;
        } else {
          errorText.innerText = data.detail || "Tên đăng nhập hoặc mật khẩu không đúng.";
          errorBox.classList.remove("hidden");
          btnSubmit.innerText = "Đăng Nhập Vào Hệ Thống";
          btnSubmit.disabled = false;
        }
      } catch (err) {
        errorText.innerText = "Lỗi kết nối tới máy chủ.";
        errorBox.classList.remove("hidden");
        btnSubmit.innerText = "Đăng Nhập Vào Hệ Thống";
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
